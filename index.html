  <script>
    const AGENT_TYPING_DELAY = 2000;
    const AUTO_PLAY_MIN_DELAY = 1000;
    const AUTO_PLAY_MAX_DELAY = 1000;
    const AUTO_PLAY_MS_PER_WORD = 22;
    const DESIGN_WIDTH = 1440;
    const DESIGN_HEIGHT = 900;
    const COMPACT_BREAKPOINT = 980;
    const root = document.documentElement;
    let stages = [];
    let chatMessages = [];
    let groupRooms = [];
    let playbackEvents = [];
    let renderedStageIds = new Set();
    let logRevealTimer = null;
    let autoScrollRelease = null;
    let isAutoScrolling = false;
    let playbackCursor = 0;
    let isMessagePending = false;
    let autoPlayTimer = null;
    let isAutoPlaying = false;
    let activeRoom = '';
    let milestoneRenderKey = '';
    let skillLibraryUnlocked = false;
    let focusedSkillRef = '';
    let skillState = new Map();
    let mentionRegex = null;
    const mentionAccentByTerm = new Map();
    const SKILL_REGISTRY = {
      place: {
        name: 'Place',
        summary: 'Guarded block placement with bounds check, air_check, and rollback metadata.',
        learnedLabel: 'Foreman-E Worker Pool',
        sharedTo: 'Foreman-A/B/C/D/E pools',
        accent: '#72ffd1'
      },
      remove: {
        name: 'Remove',
        summary: 'Delete temporary or incorrect blocks only after tag ownership and rollback checks.',
        learnedLabel: 'Foreman-E cleanup',
        sharedTo: 'Foreman-A/B/C/D/E pools',
        accent: '#ffd987'
      },
      replace: {
        name: 'Replace',
        summary: 'Verify wrong block, remove it safely, place correction, then write audit record.',
        learnedLabel: 'Foreman-C row patch',
        sharedTo: 'Foreman-A/B/C/D/E pools',
        accent: '#f06f9f'
      }
    };

    const logBoard = document.querySelector('.log-board');
    const roomList = document.querySelector('#room-list');
    let roomTabs = [];
    const chatFeed = document.querySelector('#chat-feed');
    const systemLine = document.querySelector('#system-line');
    const skillLibrary = document.querySelector('#skill-library');
    const skillList = document.querySelector('#skill-list');
    const skillRoute = document.querySelector('#skill-route');
    const logKicker = document.querySelector('#log-kicker');
    const consoleTaskTitle = document.querySelector('#console-task-title');
    const consoleRunId = document.querySelector('#console-run-id');
    const milestoneList = document.querySelector('#milestone-list');
    const milestoneCount = document.querySelector('#milestone-count');
    const consoleProgressValue = document.querySelector('#console-progress-value');
    const consoleElapsedValue = document.querySelector('#console-elapsed-value');
    const consoleProgressBar = document.querySelector('#console-progress-bar');
    const consoleElapsedBar = document.querySelector('#console-elapsed-bar');
    const consoleMeters = document.querySelectorAll('.console-meter');
    const playbackPrev = document.querySelector('#playback-prev');
    const playbackNext = document.querySelector('#playback-next');
    const playbackAuto = document.querySelector('#playback-auto');
    const playbackStep = document.querySelector('#playback-step');
    const playbackJump = document.querySelector('#playback-jump');
    const playbackCounter = document.querySelector('#playback-counter');

    function updateUiScale() {
      const viewport = window.visualViewport || window;
      const viewportWidth = viewport.width || window.innerWidth;
      const viewportHeight = viewport.height || window.innerHeight;
      const rawScale = Math.min(viewportWidth / DESIGN_WIDTH, viewportHeight / DESIGN_HEIGHT);
      const isCompact = viewportWidth <= COMPACT_BREAKPOINT;
      const minScale = isCompact ? 0.82 : 0.74;
      const scale = Math.min(Math.max(rawScale, minScale), 1.45);
      root.style.setProperty('--ui-scale', scale.toFixed(4));
    }

    const escapeHtml = (value = '') => String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

    const escapeRegExp = (value = '') => String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    const titleCase = (value = '') => String(value)
      .split(/(\s+|-)/)
      .map((part) => (/^\w/.test(part) ? part.charAt(0).toUpperCase() + part.slice(1) : part))
      .join('');

    function addMentionTerm(terms, term, accent) {
      const cleaned = String(term || '').trim();
      if (cleaned.length < 3) return;
      terms.set(cleaned.toLowerCase(), { term: cleaned, accent });
    }

    function buildMentionIndex(groups) {
      const terms = new Map();
      [
        ['User', '#ffcf66'],
        ['System Bot', '#72ffd1'],
        ['Project Manager', '#ffd987'],
        ['Designer', '#f6a5ff'],
        ['TRELLIS', '#74d6c4'],
        ['Foreman-A', '#ffd987'],
        ['Foreman-B', '#9ddcff'],
        ['Foreman-C', '#f06f9f'],
        ['Foreman-D', '#a7ff83'],
        ['Foreman-E', '#ffb66e'],
        ['Pool A', '#ffd987'],
        ['Pool B', '#9ddcff'],
        ['Pool C', '#f06f9f'],
        ['Pool D', '#a7ff83'],
        ['Pool E', '#ffb66e'],
        ['Skill Library', '#72ffd1'],
        ['Shared Skill Library', '#72ffd1']
      ].forEach(([term, accent]) => addMentionTerm(terms, term, accent));
      groups.forEach((group) => {
        Object.entries(group.agents || {}).forEach(([key, agent]) => {
          const accent = agent.accent || '#ffd987';
          addMentionTerm(terms, agent.name, accent);
          addMentionTerm(terms, key, accent);
          addMentionTerm(terms, titleCase(key.replace(/-/g, ' ')), accent);
          addMentionTerm(terms, titleCase(key), accent);

          const foremanMatch = key.match(/^foreman-([a-z])$/);
          if (foremanMatch) addMentionTerm(terms, `Foreman-${foremanMatch[1].toUpperCase()}`, accent);

          const workerMatch = key.match(/^worker-(\d+)$/);
          if (workerMatch) addMentionTerm(terms, `Worker-${workerMatch[1]}`, accent);

          if (key === 'system-bot') addMentionTerm(terms, 'System Bot', accent);
          if (key === 'project-manager') addMentionTerm(terms, 'Project Manager', accent);
          if (key === 'skill-library') {
            addMentionTerm(terms, 'Skill Library', accent);
            addMentionTerm(terms, 'Shared Skill Library', accent);
          }
        });
      });
      Object.values(SKILL_REGISTRY).forEach((skill) => {
        addMentionTerm(terms, skill.name, skill.accent || '#72ffd1');
        addMentionTerm(terms, skill.name.replace(/_/g, ' '), skill.accent || '#72ffd1');
        addMentionTerm(terms, 'Skill Scheduler', '#72ffd1');
      });

      mentionAccentByTerm.clear();
      [...terms.values()].forEach(({ term, accent }) => mentionAccentByTerm.set(term.toLowerCase(), accent));
      const pattern = [...terms.values()]
        .map(({ term }) => escapeRegExp(term))
        .sort((a, b) => b.length - a.length)
        .join('|');
      mentionRegex = pattern ? new RegExp(`(^|[^A-Za-z0-9_-])(${pattern})(?=$|[^A-Za-z0-9_-])`, 'gi') : null;
    }

    function appendMentionedText(node, value = '') {
      const text = String(value || '');
      node.replaceChildren();
      if (!mentionRegex) {
        node.textContent = text;
        return;
      }

      mentionRegex.lastIndex = 0;
      let cursor = 0;
      let match;
      while ((match = mentionRegex.exec(text)) !== null) {
        const prefix = match[1] || '';
        const mention = match[2] || '';
        const mentionStart = match.index + prefix.length;
        const mentionEnd = mentionStart + mention.length;
        if (mentionStart > cursor) node.append(document.createTextNode(text.slice(cursor, mentionStart)));

        const span = document.createElement('span');
        span.className = 'agent-mention';
        span.style.setProperty('--mention-accent', mentionAccentByTerm.get(mention.toLowerCase()) || '#ffd987');
        span.textContent = mention;
        node.append(span);
        cursor = mentionEnd;
      }

      if (cursor < text.length) node.append(document.createTextNode(text.slice(cursor)));
    }

    function ensureSkillState(skillRef = '') {
      const ref = String(skillRef || '').trim();
      if (!ref) return null;
      if (!skillState.has(ref)) {
        const fallbackName = ref.replace(/_/g, ' ');
        skillState.set(ref, {
          ref,
          ...(SKILL_REGISTRY[ref] || {
            name: ref,
            summary: `${fallbackName} shared across Foreman groups.`,
            learnedLabel: 'Learned in pool',
            baseRoute: ['learn', 'publish', 'reuse']
          }),
          learned: false,
          published: false,
          learnedRoom: '',
          usedRooms: new Set(),
          events: []
        });
      }
      return skillState.get(ref);
    }

    function resetSkillState() {
      skillState = new Map();
      Object.keys(SKILL_REGISTRY).forEach(ensureSkillState);
      focusedSkillRef = Object.keys(SKILL_REGISTRY)[0] || '';
      skillLibraryUnlocked = false;
      renderSkillLibrary();
    }

    function getSkillEventLabel(kind = '') {
      if (kind === 'skill-detection') return 'Skill learned';
      if (kind === 'skill-broadcast') return 'Skill broadcast';
      if (kind === 'skill-use') return 'Skill reused';
      return 'Skill event';
    }

    function getSkillSchedule(skillRef) {
      return playbackEvents
        .map((event, index) => ({ ...event, index }))
        .filter((event) => (event.skill || event.message?.skillRef) === skillRef);
    }

    function updateSkillStateFromEvent(event, index = -1) {
      const skillRef = event?.skill || event?.message?.skillRef;
      const skill = ensureSkillState(skillRef);
      if (!skill) return;

      const kind = event.message?.kind || event.type || 'skill-event';
      const stageTitle = event.group?.title || event.stageLabel || 'Build Pools';
      skill.learned = true;
      skill.published = true;
      skill.learnedRoom = stageTitle;
      ['Foreman-A Worker Pool', 'Foreman-B Worker Pool', 'Foreman-C Worker Pool', 'Foreman-D Worker Pool', 'Foreman-E Worker Pool']
        .forEach((room) => skill.usedRooms.add(room));
      focusedSkillRef = skill.ref;
      skill.events.push({ index, kind, room: event.group?.id || `stage-${event.stageId}`, title: stageTitle });
      skillLibraryUnlocked = true;
      renderSkillLibrary(skill.ref);
    }

    function getSkillStatus(skill) {
      if (skill.published) return 'shared';
      if (skill.learned) return 'learned';
      if (skill.usedRooms.size) return `${skill.usedRooms.size} ${skill.usedRooms.size === 1 ? 'room' : 'rooms'}`;
      return 'locked';
    }

    function summarizeRooms(rooms, fallback = 'Waiting') {
      const values = [...rooms];
      if (!values.length) return fallback;
      return values
        .map((room) => room
          .replace(' Worker Pool', '')
          .replace('Project Manager and ', 'PM + '))
        .join(', ');
    }

    function activateSkillCard(skillRef) {
      focusedSkillRef = skillRef;
      renderSkillLibrary(skillRef);
      if (isMessagePending) return;
      const schedule = getSkillSchedule(skillRef);
      if (!schedule.length) return;
      const nextEvent = schedule.find((event) => event.index + 1 > playbackCursor) || schedule[0];
      renderPlaybackUntil(nextEvent.index + 1);
    }

    function getSkillIconMarkup(skillRef = '') {
      const icons = {
        place: `
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="12" y="10" width="24" height="8" fill="#7cc85f"/>
            <rect x="8" y="18" width="32" height="18" fill="#8b5a2b"/>
            <rect x="12" y="18" width="8" height="18" fill="#a96d34"/>
            <rect x="28" y="18" width="8" height="18" fill="#6f4523"/>
            <rect x="8" y="18" width="32" height="4" fill="#5fae4c"/>
            <rect x="14" y="24" width="5" height="5" fill="#6b3d1f"/>
            <rect x="25" y="29" width="6" height="4" fill="#5a331b"/>
            <rect x="10" y="36" width="28" height="4" fill="#3b2415"/>
          </svg>`,
        remove: `
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="10" y="12" width="28" height="26" fill="#7f8b91"/>
            <rect x="14" y="16" width="8" height="8" fill="#aab5b8"/>
            <rect x="26" y="16" width="8" height="8" fill="#66747b"/>
            <rect x="14" y="28" width="8" height="6" fill="#5e6a70"/>
            <rect x="25" y="27" width="9" height="7" fill="#9da8ac"/>
            <rect x="12" y="11" width="28" height="4" fill="#c4cccf"/>
            <rect x="6" y="21" width="36" height="7" fill="#ff6961"/>
            <rect x="10" y="23" width="28" height="3" fill="#ffd0cc"/>
          </svg>`,
        replace: `
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="7" y="21" width="15" height="15" fill="#8b5a2b"/>
            <rect x="7" y="17" width="15" height="5" fill="#7cc85f"/>
            <rect x="26" y="12" width="15" height="15" fill="#66747b"/>
            <rect x="26" y="12" width="15" height="5" fill="#aab5b8"/>
            <rect x="20" y="28" width="11" height="4" fill="#ffd987"/>
            <rect x="28" y="24" width="4" height="12" fill="#ffd987"/>
            <rect x="32" y="27" width="5" height="6" fill="#ffd987"/>
            <rect x="10" y="36" width="28" height="3" fill="#3b2415"/>
          </svg>`
      };
      return icons[skillRef] || `
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="12" y="12" width="24" height="24" fill="#74d6c4"/>
          <rect x="16" y="16" width="16" height="16" fill="#0d1c16"/>
        </svg>`;
    }

    function renderSkillLibrary(activeRef = focusedSkillRef) {
      if (!skillList || !skillRoute) return;
      const baseSkills = Object.keys(SKILL_REGISTRY).map(ensureSkillState).filter(Boolean);
      const extraSkills = [...skillState.values()].filter((skill) => !SKILL_REGISTRY[skill.ref]);
      const skills = [...baseSkills, ...extraSkills];
      const unlockedCount = skills.filter((skill) => skill.learned || skill.events.length).length;
      skillLibrary?.classList.toggle('is-empty', unlockedCount === 0);
      const title = skillLibrary?.querySelector('h3');
      if (title) title.textContent = `Skill · ${unlockedCount}/${skills.length}`;
      skillList.replaceChildren();

      skills.forEach((skill) => {
        const isUnlocked = skill.learned || skill.events.length;
        const item = document.createElement('li');
        const button = document.createElement('button');
        button.className = `skill-card${skill.ref === activeRef && isUnlocked ? ' active' : ''}${isUnlocked ? '' : ' is-locked'}`;
        button.type = 'button';
        button.dataset.skillRef = skill.ref;
        button.disabled = !isUnlocked;
        button.setAttribute('aria-pressed', String(skill.ref === activeRef && isUnlocked));
        const learnedFrom = skill.learnedRoom || skill.learnedLabel || 'Waiting';
        const usedBy = summarizeRooms(skill.usedRooms, 'No reuse yet');
        button.title = isUnlocked
          ? `${skill.name}: ${skill.summary} Learned in ${learnedFrom}. Shared to ${skill.sharedTo}. Used by ${usedBy}.`
          : 'Empty skill slot';
        button.innerHTML = isUnlocked ? `
          <span class="skill-icon">${getSkillIconMarkup(skill.ref)}</span>
          <span class="skill-name">${escapeHtml(skill.name)}</span>
          <span class="skill-status">${escapeHtml(getSkillStatus(skill))}</span>
          <span class="skill-detail-grid" aria-label="${escapeHtml(skill.name)} sharing details">
            <span class="skill-detail"><b>Learned in</b><span title="${escapeHtml(learnedFrom)}">${escapeHtml(learnedFrom)}</span></span>
            <span class="skill-detail"><b>Shared to</b><span title="${escapeHtml(skill.sharedTo)}">${escapeHtml(skill.sharedTo)}</span></span>
            <span class="skill-detail"><b>Used by</b><span title="${escapeHtml(usedBy)}">${escapeHtml(usedBy)}</span></span>
          </span>
          <span class="skill-share-line">Shared via global Skill Library, not private to the learning room.</span>
          <span class="skill-jump">Jump to next ${escapeHtml(skill.name)} event -></span>
        ` : `
          <span class="skill-icon" aria-hidden="true"></span>
          <span class="skill-name">Empty</span>
        `;
        if (isUnlocked) button.addEventListener('click', () => activateSkillCard(skill.ref));
        item.append(button);
        skillList.append(item);
      });

      const routeItems = [
        { label: 'Shared scope: Foreman-A', active: true },
        { label: 'Foreman-B', active: true },
        { label: 'Foreman-C', active: true },
        { label: 'Foreman-D', active: true },
        { label: 'Foreman-E', active: true }
      ];
      skillRoute.replaceChildren(...routeItems.map((item) => {
        const node = document.createElement('span');
        node.className = item.active ? 'active' : '';
        node.textContent = item.label;
        node.title = item.label;
        return node;
      }));
    }

    function accessoryMarkup(kind, trim, dark) {
      const items = {
        crown: `<rect x="20" y="4" width="24" height="6" fill="${trim}"/><rect x="16" y="8" width="8" height="8" fill="${trim}"/><rect x="28" y="8" width="8" height="8" fill="#fff2a8"/><rect x="40" y="8" width="8" height="8" fill="${trim}"/>`,
        hardhat: `<rect x="14" y="10" width="36" height="8" fill="${trim}"/><rect x="18" y="6" width="28" height="8" fill="#ffd45f"/><rect x="30" y="6" width="4" height="12" fill="#8b5a13"/>`,
        flag: `<rect x="45" y="9" width="3" height="25" fill="${dark}"/><rect x="48" y="9" width="11" height="8" fill="${trim}"/><rect x="48" y="17" width="7" height="7" fill="#ffd7e6"/>`,
        compass: `<rect x="47" y="36" width="10" height="10" fill="${dark}"/><rect x="50" y="33" width="4" height="16" fill="${trim}"/><rect x="44" y="39" width="16" height="4" fill="${trim}"/>`,
        chest: `<rect x="8" y="41" width="17" height="13" fill="#9a5b25"/><rect x="8" y="45" width="17" height="3" fill="${trim}"/><rect x="15" y="42" width="4" height="6" fill="#ffe08a"/>`,
        pickaxe: `<path d="M42 12 L54 22" stroke="${trim}" stroke-width="5"/><path d="M49 18 L32 45" stroke="${dark}" stroke-width="5"/><rect x="29" y="43" width="8" height="8" fill="${trim}"/>`,
        trowel: `<path d="M43 38 L55 50" stroke="${dark}" stroke-width="4"/><rect x="47" y="34" width="10" height="7" fill="${trim}"/>`,
        torch: `<rect x="50" y="31" width="5" height="20" fill="#6e391c"/><rect x="47" y="24" width="11" height="10" fill="${trim}"/><rect x="50" y="20" width="5" height="6" fill="#fff6a5"/>`,
        book: `<rect x="10" y="38" width="17" height="15" fill="${trim}"/><rect x="27" y="38" width="17" height="15" fill="#0d5c4f"/><rect x="26" y="38" width="2" height="15" fill="#e6fff7"/>`,
        shield: `<rect x="45" y="32" width="12" height="17" fill="${trim}"/><rect x="48" y="35" width="6" height="11" fill="#ffd1d1"/><rect x="49" y="49" width="4" height="4" fill="${trim}"/>`,
        ruler: `<rect x="45" y="34" width="6" height="23" fill="${trim}"/><rect x="51" y="38" width="4" height="2" fill="${dark}"/><rect x="51" y="46" width="4" height="2" fill="${dark}"/><rect x="51" y="54" width="4" height="2" fill="${dark}"/>`,
        goggles: `<rect x="17" y="25" width="12" height="8" fill="${trim}"/><rect x="35" y="25" width="12" height="8" fill="${trim}"/><rect x="29" y="27" width="6" height="3" fill="${dark}"/>`,
        map: `<rect x="43" y="38" width="14" height="16" fill="#e8d9a8"/><rect x="46" y="41" width="4" height="4" fill="${trim}"/><rect x="51" y="47" width="3" height="5" fill="#418a55"/>`
      };
      return items[kind] || '';
    }

    function avatarSvg(agent) {
      const avatar = agent.avatar || {};
      const skin = avatar.skin || '#c4865c';
      const hair = avatar.hair || '#2a1d15';
      const shirt = avatar.shirt || '#315c5c';
      const trim = avatar.trim || agent.accent || '#ffd987';
      const eyes = avatar.eyes || '#101010';
      const dark = '#070a08';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
        <rect width="64" height="64" fill="#08110d"/>
        <rect x="8" y="8" width="48" height="48" fill="#15241c"/>
        <rect x="14" y="42" width="36" height="14" fill="${shirt}"/>
        <rect x="25" y="35" width="14" height="11" fill="${skin}"/>
        <rect x="16" y="16" width="32" height="28" fill="${skin}"/>
        <rect x="16" y="14" width="32" height="9" fill="${hair}"/>
        <rect x="16" y="22" width="7" height="12" fill="${hair}"/>
        <rect x="41" y="22" width="7" height="8" fill="${hair}"/>
        <rect x="24" y="29" width="5" height="5" fill="${eyes}"/>
        <rect x="36" y="29" width="5" height="5" fill="${eyes}"/>
        <rect x="31" y="34" width="3" height="4" fill="#9e6348"/>
        <rect x="27" y="39" width="11" height="3" fill="${dark}"/>
        <rect x="14" y="42" width="36" height="4" fill="${trim}"/>
        <rect x="10" y="10" width="44" height="3" fill="${trim}" opacity="0.52"/>
        <rect x="10" y="54" width="44" height="3" fill="${dark}" opacity="0.62"/>
        ${accessoryMarkup(avatar.accessory, trim, dark)}
      </svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function applyRoomVisibility() {
      if (!roomList) return;
      chatFeed.querySelectorAll('[data-stage-filter]').forEach((node) => {
        node.classList.toggle('room-hidden', activeRoom !== 'all' && node.dataset.stageFilter !== activeRoom);
      });
    }

    function setRoom(room, scrollBehavior = 'smooth') {
      if (!roomList) return;
      activeRoom = room;
      logBoard.dataset.room = room;
      roomTabs.forEach((tab) => {
        const isActive = tab.dataset.room === room;
        tab.classList.toggle('active', isActive);
        tab.setAttribute('aria-pressed', String(isActive));
      });
      applyRoomVisibility();
      lockAutoScrollSync();
      chatFeed.scrollTo({ top: 0, behavior: scrollBehavior });
    }

    function renderRoomList(groups, entryGroup = 'all') {
      if (!roomList) return;
      roomList.replaceChildren();
      const allButton = document.createElement('button');
      allButton.className = 'room-tab event-filter-tab';
      allButton.type = 'button';
      allButton.dataset.room = 'all';
      allButton.innerHTML = '<span class="filter-count">ALL</span><span><span class="room-name">All Stages</span></span>';
      allButton.addEventListener('click', () => setRoom('all'));
      roomList.append(allButton);

      groups.forEach((group) => {
        const button = document.createElement('button');
        button.className = 'room-tab event-filter-tab';
        button.type = 'button';
        button.dataset.room = `stage-${group.id}`;
        const count = group.events?.length ?? 0;
        button.classList.toggle('has-skill-event', (group.events || []).some((event) => event.skill));
        button.innerHTML = `<span class="filter-count">${escapeHtml(String(count).padStart(2, '0'))}</span><span><span class="room-name">${escapeHtml(group.label)}</span></span>`;
        button.addEventListener('click', () => setRoom(`stage-${group.id}`));
        roomList.append(button);
      });
      roomTabs = [...roomList.querySelectorAll('.room-tab')];
      setRoom(entryGroup, 'auto');
    }

    function createStageDivider(event) {
      const divider = document.createElement('div');
      divider.className = 'stage-divider is-entering';
      divider.dataset.stageFilter = `stage-${event.stageId}`;
      divider.dataset.chatStage = String(event.stageId);
      divider.innerHTML = `
        <span>${escapeHtml(event.stageLabel || `Stage ${event.stageId}`)}</span>
        <p>${escapeHtml(event.stageSummary || '')}</p>
      `;
      divider.addEventListener('animationend', () => divider.classList.remove('is-entering'), { once: true });
      return divider;
    }

    function appendStageDividerIfNeeded(event) {
      const key = String(event.stageId);
      if (renderedStageIds.has(key)) return;
      renderedStageIds.add(key);
      chatFeed.append(createStageDivider(event));
    }

    function createChatMessage(event, index) {
      const article = document.createElement('article');
      article.className = 'event-row terminal-log-line is-entering';
      article.dataset.chatStage = String(event.stageId);
      article.dataset.stageFilter = `stage-${event.stageId}`;
      article.dataset.eventKind = event.type || 'EVENT';
      article.dataset.eventIndex = String(index);
      if (event.skill) {
        article.dataset.skillRef = event.skill;
        article.title = `Skill event: ${event.skill}`;
      }

      const time = document.createElement('span');
      time.className = 'event-time';
      time.textContent = `[${event.time || '--:--'}]`;

      const badge = document.createElement('span');
      badge.className = 'event-badge';
      badge.textContent = `[${event.type || 'EVENT'}]`;

      const text = document.createElement('p');
      text.className = 'event-text';
      appendMentionedText(text, event.text || '');

      article.append(time, badge, text);
      article.addEventListener('animationend', () => article.classList.remove('is-entering'), { once: true });
      setTimeout(() => article.classList.remove('is-entering'), 320);
      return article;
    }

    function scrollChatToBottom(index) {
      chatFeed.scrollTo({ top: chatFeed.scrollHeight, behavior: index === 0 ? 'auto' : 'smooth' });
    }

    function lockAutoScrollSync() {
      isAutoScrolling = true;
      clearTimeout(autoScrollRelease);
      autoScrollRelease = setTimeout(() => { isAutoScrolling = false; }, 900);
    }

    function stopAutoPlay(update = true) {
      clearTimeout(autoPlayTimer);
      autoPlayTimer = null;
      isAutoPlaying = false;
      if (update) updatePlaybackControls();
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getReadableText(message = {}) {
      return String(message.text || message.systemLog || message.note || '');
    }

    function countReadingUnits(text = '') {
      const latinWords = text.match(/[A-Za-z0-9_./-]+/g) || [];
      const cjkChars = text.match(/[\u3400-\u9FFF\uF900-\uFAFF]/g) || [];
      const otherChars = text
        .replace(/[A-Za-z0-9_./-]+/g, '')
        .replace(/[\u3400-\u9FFF\uF900-\uFAFF]/g, '')
        .replace(/\s/g, '').length;

      return latinWords.length + Math.ceil(cjkChars.length / 2) + Math.ceil(otherChars / 6);
    }

    function getAutoPlayDelay(event) {
      const units = countReadingUnits(getReadableText(event?.message));
      return clamp(520 + (units * AUTO_PLAY_MS_PER_WORD), AUTO_PLAY_MIN_DELAY, AUTO_PLAY_MAX_DELAY);
    }

    function buildMilestoneNodes() {
      const stageById = new Map([...stages, ...groupRooms].map((stage) => [Number(stage.id), stage]));
      const summaryOf = (stageId, fallback) => stageById.get(Number(stageId))?.summary || stageById.get(Number(stageId))?.system || fallback;
      return [
        {
          id: 'pm-terminal',
          startStage: 0,
          endStage: 5,
          code: '[PM]',
          label: 'PM Control',
          command: 'pm-orchestrator boot --session cs-704e',
          role: 'root process supervising every sub terminal',
          summary: 'Project Manager owns the full run and spawns sub terminals as needed.',
          level: 0,
          prefix: 'pm',
          root: true
        },
        {
          id: 'initialize',
          startStage: 0,
          endStage: 1,
          code: '[01]',
          label: 'Initialize',
          command: 'system ingest request --attach source.png',
          role: 'request parsed, run context opened',
          summary: summaryOf(0, 'System opens the run and Project Manager prepares orchestration.'),
          level: 1,
          prefix: 'job'
        },
        {
          id: 'design-blueprint',
          startStage: 2,
          endStage: 2,
          code: '[02]',
          label: 'Blueprint',
          command: 'designer scan image --emit build_spec',
          role: 'design terminal creates structure plan',
          summary: summaryOf(2, 'Designer converts the image into blueprint artifacts.'),
          level: 1,
          prefix: 'job'
        },
        {
          id: 'foreman-dispatch',
          startStage: 3,
          endStage: 3,
          code: '[03]',
          label: 'Dispatch',
          command: 'pm split work --lanes A,B,C,D,E',
          role: 'packets routed to foreman terminals',
          summary: summaryOf(3, 'PM splits packets and starts five Foreman worker-pool rooms.'),
          level: 1,
          prefix: 'job'
        },
        {
          id: 'parallel-build',
          startStage: 4,
          endStage: 4,
          code: '[04]',
          label: 'Parallel Build',
          command: 'foremen run --parallel --share-skill-cache',
          role: '5 live panes place, remove, replace blocks',
          summary: 'Keeps Foreman-A through Foreman-E working in parallel and coordinates shared SKILLs.',
          level: 1,
          prefix: 'fork',
          parallel: true,
          workers: ['A', 'B', 'C', 'D', 'E']
        },
        {
          id: 'return',
          startStage: 5,
          endStage: 5,
          code: '[05]',
          label: 'Verify & Pack',
          command: 'pm merge outputs --audit --package',
          role: 'final world, reports, logs returned',
          summary: summaryOf(5, 'PM verifies the merged build and returns final artifacts.'),
          level: 1,
          prefix: 'ret'
        }
      ];
    }

    function getMilestoneState(node, currentId, isComplete) {
      if (isComplete || currentId > Number(node.endStage)) return 'complete';
      if (currentId >= Number(node.startStage) && currentId <= Number(node.endStage)) return 'running';
      return 'pending';
    }

    function createMilestoneItem(node, state, options = {}) {
      const item = document.createElement('li');
      const stateLabel = state === 'running' ? 'executing' : (state === 'complete' ? 'complete' : 'pending');
      item.className = `milestone-item is-${state}${node.root ? ' is-root' : ''}${node.parallel ? ' is-parallel' : ''}${options.worker ? ' is-worker' : ''}`;
      item.dataset.stage = String(node.startStage);
      item.dataset.milestoneId = node.id;
      const loadMarkup = options.worker ? `<span class="milestone-load" style="--worker-load: ${options.load || 70}%" aria-hidden="true"></span>` : '';
      item.innerHTML = `
        <span class="milestone-body">
          <span class="milestone-branch" aria-hidden="true">${escapeHtml(node.prefix || 'sub')}</span>
          <span class="milestone-line">
            <strong data-code="${escapeHtml(node.code || '')}">${escapeHtml(node.label)}</strong>
            <span class="milestone-status-light" title="${escapeHtml(stateLabel)}" aria-label="${escapeHtml(stateLabel)}"></span>
          </span>
          <span class="milestone-role">${escapeHtml(node.role || '')}</span>
          ${loadMarkup}
          <span class="milestone-summary">${escapeHtml(node.summary || '')}</span>
        </span>
      `;
      return item;
    }

    function createWorkerTree(parentNode, state) {
      if (!parentNode.workers?.length) return null;
      const workerTree = document.createElement('ol');
      workerTree.className = 'milestone-children milestone-worker-tree';
      parentNode.workers.forEach((worker, index) => {
        const workerNode = {
          id: `${parentNode.id}-foreman-${worker}`,
          startStage: parentNode.startStage,
          endStage: parentNode.endStage,
          code: `F-${worker}`,
          label: `Foreman ${worker}`,
          command: `lane-${worker.toLowerCase()} stream patch`,
          role: `sub terminal lane ${worker}`,
          prefix: 'tty'
        };
        workerTree.append(createMilestoneItem(workerNode, state, {
          worker: true,
          load: 72 + (index * 5)
        }));
      });
      return workerTree;
    }

    function renderMilestones(currentStageId = stages[0]?.id ?? 0) {
      if (!milestoneList) return;
      const total = playbackEvents.length;
      const isComplete = total > 0 && playbackCursor >= total;
      const currentId = Number(currentStageId);
      const sourceNodes = buildMilestoneNodes();
      const rootNode = sourceNodes.find((node) => node.root) || sourceNodes[0];
      const childNodes = sourceNodes.filter((node) => node !== rootNode);
      const visibleChildren = childNodes.filter((node) => isComplete || Number(node.startStage) <= currentId);
      const visibleCount = (rootNode ? 1 : 0) + visibleChildren.length;
      const renderKey = `${currentId}:${isComplete}:${visibleCount}:${sourceNodes.length}`;
      if (renderKey === milestoneRenderKey && milestoneList.children.length) {
        return;
      }
      milestoneRenderKey = renderKey;
      milestoneList.replaceChildren();
      if (milestoneCount) milestoneCount.textContent = `${visibleCount}/${sourceNodes.length} shown`;

      if (!rootNode) return;
      const rootState = getMilestoneState(rootNode, currentId, isComplete);
      const rootItem = createMilestoneItem(rootNode, rootState);
      const childTree = document.createElement('ol');
      childTree.className = 'milestone-children';

      visibleChildren.forEach((node) => {
        const state = getMilestoneState(node, currentId, isComplete);
        const item = createMilestoneItem(node, state);
        const workerTree = createWorkerTree(node, state);
        if (workerTree) item.append(workerTree);
        childTree.append(item);
      });

      if (visibleChildren.length) rootItem.append(childTree);
      milestoneList.append(rootItem);
    }

    function scheduleAutoPlay() {
      if (!isAutoPlaying) return;
      clearTimeout(autoPlayTimer);
      const previousEvent = playbackEvents[Math.max(playbackCursor - 1, 0)];
      const delay = getAutoPlayDelay(previousEvent);
      autoPlayTimer = setTimeout(() => {
        autoPlayTimer = null;
        if (!isAutoPlaying) return;
        if (playbackCursor >= playbackEvents.length) {
          stopAutoPlay();
          return;
        }
        advancePlayback({ fromAuto: true });
      }, delay);
    }

    function updatePlaybackControls() {
      const total = playbackEvents.length;
      const shown = Math.min(playbackCursor, total);
      const isComplete = shown >= total && total > 0;

      renderMilestones(playbackEvents[Math.max(shown - 1, 0)]?.stageId ?? stages[0]?.id ?? 0);

      if (playbackPrev) playbackPrev.disabled = isMessagePending || isAutoPlaying || shown <= 0;
      if (playbackAuto) {
        playbackAuto.disabled = total === 0;
        playbackAuto.textContent = isAutoPlaying ? 'Pause' : (isComplete ? 'Replay' : 'Play');
      }
      if (playbackStep) {
        playbackStep.max = String(total);
        playbackStep.disabled = isMessagePending || isAutoPlaying || total === 0;
        if (document.activeElement !== playbackStep) playbackStep.value = String(shown);
      }
      if (playbackJump) playbackJump.disabled = isMessagePending || isAutoPlaying || total === 0;
      if (playbackCounter) playbackCounter.textContent = `Event ${shown}/${total}`;

      if (!playbackNext) return;

      playbackNext.disabled = isMessagePending || isAutoPlaying || shown >= total || total === 0;
      if (isMessagePending) {
        playbackNext.textContent = 'Revealing...';
      } else if (shown >= total && total > 0) {
        playbackNext.textContent = 'Complete';
      } else if (shown === 0) {
        playbackNext.textContent = 'Start Run';
      } else {
        playbackNext.textContent = 'Next Event';
      }
    }

    function advancePlayback(options = {}) {
      if (!options.fromAuto) stopAutoPlay(false);
      if (isMessagePending || playbackCursor >= playbackEvents.length) return;
      chatFeed.querySelector('.chat-placeholder')?.remove();
      isMessagePending = true;
      updatePlaybackControls();
      revealChatMessage(playbackCursor);
    }

    function revealChatMessage(index = 0) {
      const event = playbackEvents[index];
      if (!event) {
        isMessagePending = false;
        updatePlaybackControls();
        return;
      }

      const article = createChatMessage(event, index);
      chatFeed.append(article);

      if (event.skill) updateSkillStateFromEvent(event, index);
      chatMessages = [...document.querySelectorAll('.event-row[data-chat-stage]')];
      applyRoomVisibility();
      setStage(event.stageId, article, event);
      lockAutoScrollSync();
      scrollChatToBottom(index);
      playbackCursor = index + 1;
      isMessagePending = false;
      if (playbackCursor >= playbackEvents.length) stopAutoPlay(false);
      updatePlaybackControls();
      scheduleAutoPlay();
    }

    function renderChat(events) {
      stopAutoPlay(false);
      clearTimeout(logRevealTimer);
      clearTimeout(autoScrollRelease);
      clearTimeout(autoPlayTimer);
      autoPlayTimer = null;
      logRevealTimer = null;
      isAutoScrolling = false;
      playbackCursor = 0;
      isMessagePending = false;
      renderedStageIds = new Set();
      milestoneRenderKey = '';
      resetSkillState();
      skillLibrary?.classList.add('is-visible');
      chatFeed.replaceChildren();
      chatMessages = [];

      if (!events?.length) {
        chatFeed.insertAdjacentHTML('beforeend', '<div class="log-error">No run events found in <code>data/run-events.json</code>.</div>');
        applyRoomVisibility();
        updatePlaybackControls();
        return;
      }

      chatFeed.insertAdjacentHTML('beforeend', '<div class="chat-placeholder"><strong>Console armed</strong>Run log will stream automatically; press <span class="mono">Pause</span> to hold the feed.</div>');
      applyRoomVisibility();
      updatePlaybackControls();
    }

    function appendEventInstantly(event, index) {
      const node = createChatMessage(event, index);
      if (event.skill) updateSkillStateFromEvent(event, index);
      node.classList.remove('is-entering');
      chatFeed.append(node);
      return { node, stageId: event.stageId, event };
    }

    function renderPlaybackUntil(targetCount) {
      stopAutoPlay(false);
      clearTimeout(logRevealTimer);
      clearTimeout(autoScrollRelease);
      logRevealTimer = null;
      isAutoScrolling = false;
      isMessagePending = false;
      renderedStageIds = new Set();
      milestoneRenderKey = '';
      resetSkillState();
      skillLibrary?.classList.add('is-visible');

      const total = playbackEvents.length;
      const count = Math.min(Math.max(Number(targetCount) || 0, 0), total);
      chatFeed.replaceChildren();
      chatMessages = [];

      let last = null;
      for (let index = 0; index < count; index += 1) {
        last = appendEventInstantly(playbackEvents[index], index) || last;
      }

      chatMessages = [...document.querySelectorAll('.event-row[data-chat-stage]')];
      playbackCursor = count;

      if (last) {
        applyRoomVisibility();
        setStage(last.stageId, last.node, last.event);
        lockAutoScrollSync();
        chatFeed.scrollTo({ top: chatFeed.scrollHeight, behavior: 'auto' });
      } else {
        chatFeed.insertAdjacentHTML('beforeend', '<div class="chat-placeholder"><strong>Console armed</strong>Press <span class="mono">Play</span> to stream the run log.</div>');
        applyRoomVisibility();
        setStage(stages[0]?.id ?? 0, chatMessages[0]);
      }

      updatePlaybackControls();
    }

    function jumpPlaybackBy(delta) {
      if (isMessagePending || isAutoPlaying) return;
      renderPlaybackUntil(playbackCursor + delta);
    }

    function jumpPlaybackToInput() {
      if (isMessagePending || isAutoPlaying) return;
      const target = Number.parseInt(playbackStep?.value || '0', 10);
      renderPlaybackUntil(Number.isFinite(target) ? target : playbackCursor);
    }

    function toggleAutoPlay() {
      if (isAutoPlaying) {
        stopAutoPlay();
        return;
      }
      if (!playbackEvents.length) return;
      if (playbackCursor >= playbackEvents.length) renderPlaybackUntil(0);
      isAutoPlaying = true;
      updatePlaybackControls();
      if (!isMessagePending) advancePlayback({ fromAuto: true });
    }

    function getPlaybackTotalSeconds() {
      const eventTotal = playbackEvents.at(-1)?.seconds;
      const stageTotal = parseTimelineTime(stages.at(-1)?.metrics?.[1] || '00:00.0');
      return Math.max(eventTotal || 0, stageTotal || 0, 1);
    }

    function setStage(stageId, activeMessage = null, activeEvent = null) {
      const stage = stages.find((item) => Number(item.id) === Number(stageId)) || stages[0];
      if (!stage) return;

      if (systemLine) appendMentionedText(systemLine, stage.system);
      skillLibrary?.classList.add('is-visible');
      if (activeMessage?.dataset.skillRef) renderSkillLibrary(activeMessage.dataset.skillRef);

      const eventIndex = Number(activeMessage?.dataset.eventIndex);
      const focusedEvent = activeEvent || (Number.isFinite(eventIndex) ? playbackEvents[eventIndex] : null);
      const fallbackTime = playbackCursor === 0 && !focusedEvent ? '00:00.0' : stage.metrics?.[1] || '00:00.0';
      const elapsedTime = focusedEvent?.time || fallbackTime;
      const elapsedSeconds = focusedEvent ? focusedEvent.seconds : parseTimelineTime(elapsedTime);
      const progressValue = `${Math.round(clamp((elapsedSeconds / getPlaybackTotalSeconds()) * 100, 0, 100))}%`;

      if (consoleProgressValue) consoleProgressValue.textContent = progressValue;
      if (consoleElapsedValue) consoleElapsedValue.textContent = elapsedTime;
      if (consoleProgressBar) consoleProgressBar.style.width = progressValue;
      if (consoleElapsedBar) consoleElapsedBar.style.width = progressValue;
      consoleMeters.forEach((node) => { node.style.setProperty('--value', progressValue); });
      renderMilestones(stage.id);

      const fallbackMessage = chatMessages.find((node) => Number(node.dataset.chatStage) === Number(stage.id));
      const focusedMessage = activeMessage || fallbackMessage;
      chatMessages.forEach((node) => node.classList.toggle('active', node === focusedMessage));
    }

    function syncTimelineFromLog() {
      if (!chatMessages.length) return;
      const latestMessage = chatMessages[chatMessages.length - 1];
      if (!latestMessage) return;
      const eventIndex = Number(latestMessage.dataset.eventIndex);
      setStage(Number(latestMessage.dataset.chatStage), latestMessage, playbackEvents[eventIndex]);
    }

    function parseTimelineTime(time = '00:00.0') {
      const parts = String(time).split(':').map(Number);
      if (parts.length === 1) return parts[0] || 0;
      return parts.reduce((total, part) => (total * 60) + (Number.isFinite(part) ? part : 0), 0);
    }

    function buildPlaybackEvents(runStages = []) {
      return runStages
        .flatMap((stage, stageIndex) => (stage.events || []).map((event, eventIndex) => ({
          ...event,
          stageId: stage.id,
          stageLabel: stage.label,
          stageSummary: stage.summary,
          stageIndex,
          eventIndex,
          seconds: parseTimelineTime(event.time),
          group: { id: `stage-${stage.id}`, title: stage.label },
          message: {
            text: event.text,
            kind: event.type,
            skillRef: event.skill
          }
        })))
        .sort((a, b) => a.seconds - b.seconds || a.stageIndex - b.stageIndex || a.eventIndex - b.eventIndex);
    }

    const pageBaseUrl = new URL(window.location.href);
    if (pageBaseUrl.pathname.endsWith('.html')) {
      pageBaseUrl.pathname = pageBaseUrl.pathname.replace(/[^/]*$/, '');
    } else if (!pageBaseUrl.pathname.endsWith('/')) {
      pageBaseUrl.pathname = `${pageBaseUrl.pathname}/`;
    }
    pageBaseUrl.search = '';
    pageBaseUrl.hash = '';
    const siteAssetUrl = (path) => new URL(path, pageBaseUrl).toString();

    async function loadRunEvents() {
      const response = await fetch(siteAssetUrl('data/run-events.json'), { cache: 'no-store' });
      if (!response.ok) throw new Error(`Run events HTTP ${response.status}`);
      return response.json();
    }

    async function bootLog() {
      try {
        const runLog = await loadRunEvents();
        stages = runLog.stages || [];
        groupRooms = runLog.stages || [];
        buildMentionIndex([]);
        playbackEvents = buildPlaybackEvents(groupRooms);
        activeRoom = 'all';

        const runId = runLog.meta?.runId || (runLog.intro || runLog.meta?.systemIntro || '').match(/tiantan_build_\d+/)?.[0] || 'run-current';
        if (consoleTaskTitle) consoleTaskTitle.textContent = runLog.meta?.taskTitle || 'CraftUtopia Build with 100 Agents';
        if (consoleRunId) consoleRunId.textContent = `run ${runId}`;
        if (logKicker) logKicker.textContent = runLog.title || runLog.meta?.kicker || logKicker.textContent;
        if (systemLine) appendMentionedText(systemLine, runLog.intro || runLog.meta?.systemIntro || systemLine.textContent);

        renderRoomList(groupRooms, activeRoom);
        renderChat(playbackEvents);
        setStage(stages[0]?.id ?? 0, chatMessages[0]);
        toggleAutoPlay();
      } catch (error) {
        chatFeed.innerHTML = `<div class="log-error">Could not load run event data. Serve this folder with <code>python main.py</code> or another static server. ${escapeHtml(error.message)}</div>`;
        console.error(error);
      }
    }

    let scrollFrame = null;
    chatFeed.addEventListener('scroll', () => {
      if (isAutoScrolling) return;
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(() => {
        scrollFrame = null;
        syncTimelineFromLog();
      });
    }, { passive: true });

    playbackPrev?.addEventListener('click', () => jumpPlaybackBy(-1));
    playbackNext?.addEventListener('click', () => advancePlayback());
    playbackAuto?.addEventListener('click', toggleAutoPlay);
    playbackJump?.addEventListener('click', jumpPlaybackToInput);
    playbackStep?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') jumpPlaybackToInput();
    });

    updateUiScale();
    window.addEventListener('resize', updateUiScale, { passive: true });
    window.visualViewport?.addEventListener('resize', updateUiScale, { passive: true });

    window.addEventListener('pointermove', (event) => {
      const x = event.clientX / window.innerWidth - 0.5;
      const y = event.clientY / window.innerHeight - 0.5;
      root.style.setProperty('--mx', `${(x * 26).toFixed(1)}px`);
      root.style.setProperty('--my', `${(y * 20).toFixed(1)}px`);
    }, { passive: true });

    bootLog();
  </script>
</body>
