<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftUtopia Demo Hub</title>
  <link rel="stylesheet" href="assets/styles/home.css?v=20260520-no-cache-toast1">
  <script src="assets/js/hls-preload.js?v=20260520-current-demo-cache1" defer></script>
</head>
<body>
  <main class="hub" aria-label="CraftUtopia demo hub">
    <header class="hub-header">
      <div class="brand-lockup" aria-label="CraftUtopia home">
        <span>
          <span class="brand-kicker">CraftUtopia</span>
          <strong>Demo Gallery</strong>
        </span>
      </div>
    </header>

    <section class="demo-grid" aria-label="Available demos">
      <a class="demo-card is-live is-video-card" href="demos/viewer/?demo=demo">
        <img src="assets/images/CraftUtopia.png" alt="CraftUtopia overview demo preview">
        <span class="demo-card-body">
          <span class="demo-index">0</span>
          <span>
            <strong>Overview</strong>
          </span>
        </span>
      </a>

      <a class="demo-card is-live" href="demos/viewer/?demo=colosseum">
        <img src="assets/doushouchang/doushouchang.png" alt="Colosseum demo preview">
        <span class="demo-card-body">
          <span class="demo-index">1</span>
          <span>
            <strong>Colosseum</strong>
          </span>
        </span>
      </a>

      <a class="demo-card is-live" href="demos/viewer/?demo=lamborghini">
        <img src="assets/lanbo/lanbo.png" alt="Lamborghini demo preview">
        <span class="demo-card-body">
          <span class="demo-index">2</span>
          <span>
            <strong>Lamborghini</strong>
          </span>
        </span>
      </a>

      <a class="demo-card is-live" href="demos/viewer/?demo=pyramid">
        <img src="assets/jinzita/jinzita.png" alt="Pyramid demo preview">
        <span class="demo-card-body">
          <span class="demo-index">3</span>
          <span>
            <strong>Pyramid</strong>
          </span>
        </span>
      </a>

      <a class="demo-card is-live" href="demos/viewer/?demo=sydney-opera-house">
        <img src="assets/xini/xini.png" alt="Sydney Opera House demo preview">
        <span class="demo-card-body">
          <span class="demo-index">4</span>
          <span>
            <strong>Sydney Opera House</strong>
          </span>
        </span>
      </a>

      <a class="demo-card is-live" href="demos/viewer/?demo=taj-mahal">
        <img src="assets/taijiling/taijiling.png" alt="Taj Mahal demo preview">
        <span class="demo-card-body">
          <span class="demo-index">5</span>
          <span>
            <strong>Taj Mahal</strong>
          </span>
        </span>
      </a>

      <a class="demo-card is-live" href="demos/viewer/?demo=united-states-capitol">
        <img src="assets/guohui/guohui.png" alt="United States Capitol demo preview">
        <span class="demo-card-body">
          <span class="demo-index">6</span>
          <span>
            <strong>United States Capitol</strong>
          </span>
        </span>
      </a>

      <a class="demo-card is-live" href="demos/viewer/?demo=xian-bell-tower">
        <img src="assets/zhonglou/zhonglou.png" alt="Xi'an Bell Tower demo preview">
        <span class="demo-card-body">
          <span class="demo-index">7</span>
          <span>
            <strong>Xi'an Bell Tower</strong>
          </span>
        </span>
      </a>
    </section>
  </main>
</body>
</html>
