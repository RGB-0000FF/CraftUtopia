<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../">
  <title>CraftUtopia Demo Viewer</title>
  <link rel="preconnect" href="https://pub-64261b1ecf154ce6ae3ea315ada673fe.r2.dev">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preload" as="image" href="assets/ui/craftutopia-logo-tight-260.png">
  <link rel="preload" as="image" href="assets/ui/win-wreath-victory-laurel-svgsilh-cc0.svg">
  <link rel="stylesheet" href="src/styles/demo.css?v=20260527-skill-unlock-v1">
  <link rel="stylesheet" id="demo-profile-stylesheet" disabled>
</head>
<body>
  <a class="demo-home-button" href="./" aria-label="Back to demo gallery">
    <i data-lucide="arrow-left" aria-hidden="true"></i>
  </a>
  <button class="demo-video-button" id="video-only-toggle" type="button" aria-label="Show video only" aria-pressed="false">
    <i data-lucide="panel-right-close" aria-hidden="true"></i>
  </button>
  <main class="app" aria-label="CraftUtopia live multi-agent demonstration">
    <section class="status" aria-label="CraftUtopia runtime viewer">
      <header class="topline">
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div>
            <p class="kicker">CraftUtopia Runtime</p>
          </div>
        </div>
      </header>

      <div class="visual-wrap">
        <div class="scale-award" aria-label="First to scale 100 collaborative agents">
          <span class="scale-award-ribbon" aria-hidden="true"></span>
          <span class="scale-award-medal" aria-hidden="true">
            <img src="assets/ui/win-wreath-victory-laurel-svgsilh-cc0.svg" alt="">
            <span class="scale-award-rank"><b>1</b><span>ST</span></span>
          </span>
          <span class="scale-award-copy">
            <strong>First to scale</strong>
            <span>100 collaborative agents</span>
          </span>
        </div>
        <section class="top-milestone-strip" id="top-milestone-strip" aria-label="Build milestones"></section>
        <div class="skill-notification-stack" id="skill-notification-stack" aria-label="Skill library" aria-live="polite" hidden></div>
        <div class="gif-stage" aria-label="Minecraft replay preview" tabindex="0">
          <video class="world-video" muted playsinline preload="auto" aria-label="Minecraft build replay"></video>
          <div class="timeline-intro is-visible" id="timeline-intro" aria-hidden="true">
            <img src="assets/images/architecture.jpg" alt="">
          </div>
          <div class="blueprint-block-count" id="blueprint-block-count" aria-label="Blueprint block count">
            <span>Blocks</span>
            <strong id="blueprint-block-count-value">95,151</strong>
          </div>
        </div>
        <div class="build-timeline" role="slider" tabindex="0" aria-label="Elapsed build timeline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="00:00.0">
          <div class="timeline-control-slot" id="timeline-control-slot" aria-label="Playback controls"></div>
          <div class="build-timeline-head">
            <strong id="console-elapsed-value">00:00.0</strong>
          </div>
          <div class="build-timeline-rail">
            <span id="console-elapsed-bar"></span>
            <div class="timeline-markers" id="timeline-markers" aria-hidden="false"></div>
            <input id="timeline-scrubber" class="timeline-scrubber" type="range" min="0" max="1000" step="1" value="0" aria-label="Scrub build timeline">
          </div>
        </div>
        <button class="blueprint-cover-card" id="blueprint-cover-toggle" type="button" aria-label="Expand blueprint cover preview" aria-expanded="false">
          <img id="blueprint-cover-image" src="assets/images/stage-preview.jpg" alt="Blueprint cover preview">
          <span class="cover-card-label">
            <i class="cover-card-icon cover-card-icon-zoom-in" data-lucide="zoom-in" aria-hidden="true"></i>
            <i class="cover-card-icon cover-card-icon-zoom-out" data-lucide="zoom-out" aria-hidden="true"></i>
          </span>
        </button>
      </div>
    </section>

    <div class="app-resizer" id="app-resizer" role="separator" tabindex="0" aria-label="Resize terminal console" aria-orientation="vertical" aria-valuemin="420" aria-valuemax="720" aria-valuenow="560"></div>

    <div class="right-rail">
      <aside class="log-board" aria-label="Terminal task console">
        <div class="chat-shell terminal-console">
          <header class="console-header">
            <div class="console-title-group">
              <img class="console-title-logo" src="assets/ui/craftutopia-logo-tight-260.png" alt="CraftUtopia" width="260" height="138">
              <h2 id="console-task-title">CraftUtopia Build <span class="console-title-break">with <span class="console-title-scale">100</span> Agents</span></h2>
            </div>
            <div class="console-header-spacer" aria-hidden="true"></div>
            <span class="console-control-anchor" id="console-control-anchor" hidden></span>
            <div class="console-control-group">
              <div class="header-progress console-meter" style="--value: 0%" aria-label="Build progress">
                <span id="console-progress-value">0%</span>
                <i aria-hidden="true"><b id="console-progress-bar"></b></i>
              </div>
              <button class="console-play" id="playback-auto" type="button">Play</button>
              <div class="console-speed-group" aria-label="Playback speed controls">
                <button class="console-speed console-speed-step" id="playback-slower" type="button" aria-label="Slow down playback">
                  <i data-lucide="minus" aria-hidden="true"></i>
                </button>
                <button class="console-speed console-speed-value" id="playback-speed" type="button" aria-label="Playback speed: 1x">1x</button>
                <button class="console-speed console-speed-step" id="playback-faster" type="button" aria-label="Speed up playback">
                  <i data-lucide="plus" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </header>

          <section class="console-milestones" aria-label="Run milestones">
            <div class="console-section-title">
              <span>Milestones</span>
            </div>
            <ol class="milestone-list" id="milestone-list"></ol>
          </section>

          <section class="console-framework" aria-label="Execution framework">
            <div class="console-section-title framework-toggle" id="framework-toggle" role="button" tabindex="0" aria-expanded="false">
              <span>Execution Framework</span>
              <span class="framework-hint" id="framework-hint">Click to view details</span>
              <span class="framework-arrows" id="framework-arrows" aria-hidden="true"></span>
            </div>
            <div class="framework-preview">
              <button class="framework-preview-button" id="framework-open" type="button" aria-label="Open execution framework image">
                <img src="assets/images/architecture.jpg" alt="CraftUtopia execution framework architecture">
              </button>
            </div>
          </section>

          <section class="console-log" aria-label="Detailed terminal log">
            <div class="console-section-title">
              <span>Detailed Log</span>
            </div>
            <div class="chat-feed" id="chat-feed" aria-label="Execution event stream">
              <div class="log-loading">Loading execution log...</div>
            </div>
          </section>
        </div>
      </aside>
      <section class="vote-card" aria-label="Vote for CraftUtopia">
        <span>Vote for us!</span>
        <strong>dm 45: CraftUtopia</strong>
      </section>
    </div>
  </main>

  <div class="framework-lightbox" id="framework-lightbox" role="dialog" aria-modal="true" aria-label="Execution framework preview" hidden>
    <figure class="framework-lightbox-figure">
      <button class="framework-lightbox-close" id="framework-close" type="button" aria-label="Close execution framework preview">x</button>
      <img src="assets/images/architecture.jpg" alt="CraftUtopia execution framework architecture">
    </figure>
  </div>

  <script src="https://unpkg.com/lucide@1.16.0/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
  <script src="src/js/hls-preload.js?v=20260526-block-counts"></script>
  <script src="src/js/demo-config.js?v=20260527-skill-unlock-v1"></script>
  <script src="src/js/demo-utils.js?v=20260527-skill-unlock-v1"></script>
  <script src="src/js/demo-render.js?v=20260527-skill-unlock-v1"></script>
  <script src="src/js/demo-playback.js?v=20260527-skill-unlock-v1"></script>
  <script src="src/js/demo-data.js?v=20260527-skill-unlock-v1"></script>
  <script src="src/js/demo-events.js?v=20260527-skill-unlock-v1"></script>
</body>
</html>
